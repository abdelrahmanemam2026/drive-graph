<html lang="en">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { 
    background: #0a0a14; color: #e0e0e0; 
    font-family: 'Segoe UI', system-ui, sans-serif; 
    overflow: hidden; height: 100vh;
    cursor: grab;
  }
  body:active { cursor: grabbing; }
  
  #canvas {
    width: 100vw; height: 100vh;
    position: relative;
    transform-origin: 0 0;
  }
  
  .mm-node {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    user-select: none;
    border: 1px solid rgba(255,255,255,0.06);
    z-index: 1;
  }
  .mm-node:hover {
    transform: scale(1.05);
    z-index: 10;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .mm-node.center {
    font-size: 20px;
    font-weight: 700;
    padding: 14px 28px;
    border-radius: 16px;
    border: 2px solid rgba(255,215,0,0.3);
    box-shadow: 0 0 40px rgba(255,215,0,0.1);
    z-index: 100;
  }
  .mm-node.category {
    font-size: 15px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 12px;
    border-width: 1.5px;
  }
  .mm-node.file {
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 8px;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mm-node.leaf {
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 6px;
    opacity: 0.75;
    border-style: dashed;
  }
  .mm-node .emoji { font-size: 1.2em; }
  
  /* Lines between nodes */
  .mm-line {
    position: absolute;
    pointer-events: none;
    z-index: 0;
  }
  
  /* Controls */
  .controls {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .controls button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #ccc;
    padding: 8px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    backdrop-filter: blur(8px);

  .controls button:hover {

    color: #fff;

  .controls .zoom-level {
    color: #555;
    font-size: 12px;

    text-align: center;

    top: 0;

// ---- LAYOUT ALGORITHMS ----

function getRadialPos(angle, radius) {
  return {
    x: window.innerWidth/2 + Math.cos(angle) * radius,
    y: window.innerHeight/2 + Math.sin(angle) * radius
  };
}

function getTreeRightPos(depth, index, totalInLevel) {
  const startX = 80;
  const startY = window.innerHeight/2;
  const xSpacing = 260;
  const ySpacing = 50;
  return {
    x: startX + depth * xSpacing,
    y: startY + (index - (totalInLevel-1)/2) * ySpacing
  };
}

function getTreeDownPos(depth, index, totalInLevel) {
  const startX = window.innerWidth/2;
  const startY = 60;
  const xSpacing = 180;
  const ySpacing = 90;
  return {
    x: startX + (index - (totalInLevel-1)/2) * xSpacing,
    y: startY + depth * ySpacing
  };
}

function layout(node, depth, angleStart, angleEnd, parentPos, result) {
  if (!node) return;
  
  const id = node.name;
  const cx = window.innerWidth/2;
  const cy = window.innerHeight/2;
  
  let pos;
  
  if (depth === 0) {
    // Center
    pos = { x: cx, y: cy };
  } else if (layoutMode === 0) {
    // Radial layout
    const midAngle = (angleStart + angleEnd) / 2;
    const radius = 80 + depth * 160;
    pos = getRadialPos(midAngle, radius);
  } else if (layoutMode === 1) {
    // Tree right
    const total = node.children ? node.children.length : 1;
    pos = getTreeRightPos(depth, 0, 1);
  } else {
    // Tree down
    const total = node.children ? node.children.length : 1;
    pos = getTreeDownPos(depth, 0, 1);
  }
  
  result.push({
    id: id,
    node: node,
    x: pos.x,
    y: pos.y,
    depth: depth,
    parentPos: parentPos,
    type: depth === 0 ? 'center' : 
          depth === 1 ? 'category' : 
          node.leaf ? 'leaf' : 'file'
  });
  
  if (node.children) {
    const count = node.children.length;
    if (layoutMode === 0) {
      const range = angleEnd - angleStart;
      const padding = 0.15 * range / count;
      const step = (range - 2 * padding) / Math.max(count, 1);
      node.children.forEach((child, i) => {
        const childStart = angleStart + padding + i * step;
        const childEnd = childStart + step * 0.8;
        layout(child, depth + 1, childStart, childEnd, pos, result);
      });
    } else if (layoutMode === 1) {
      const totalInLevel = count;
      node.children.forEach((child, i) => {
        const p = getTreeRightPos(depth + 1, i, totalInLevel);
        result.push({
          id: child.name,
          node: child,
          x: p.x + (parentPos ? parentPos.x - p.x : -260),
          y: p.y,
          depth: depth + 1,
          parentPos: pos,
          type: depth === 0 ? 'category' : child.leaf ? 'leaf' : 'file'
        });
        if (child.children) {
          child.children.forEach((gc, j) => {
            const gp = getTreeRightPos(depth + 2, j, child.children.length);
            result.push({
              id: gc.name,
              node: gc,
              x: gp.x + (p.x - gp.x),
              y: gp.y,
              depth: depth + 2,
              parentPos: { x: p.x, y: p.y },
              type: 'leaf'
            });
          });
        }
      });
    } else {
      node.children.forEach((child, i) => {
        const p = getTreeDownPos(depth + 1, i, count);
        result.push({
          id: child.name,
          node: child,
          x: p.x,
          y: p.y + (parentPos ? parentPos.y - p.y : -90),
          depth: depth + 1,
          parentPos: pos,
          type: child.leaf ? 'leaf' : 'file'
        });
        if (child.children) {
          child.children.forEach((gc, j) => {
            const gp = getTreeDownPos(depth + 2, j, child.children.length);
            result.push({
              id: gc.name,
              node: gc,
              x: gp.x,
              y: gp.y + (p.y - gp.y),
              depth: depth + 2,
              parentPos: { x: p.x, y: p.y },
              type: 'leaf'
            });
          });
        }
      });
    }
  }
}

function render() {
  canvas.innerHTML = '';
  
  const nodes = [];
  layout(data, 0, -Math.PI, Math.PI, null, nodes);
  
  // Filter out duplicates (nested layout adds children separately)
  const unique = {};
  nodes.forEach(n => { unique[n.id] = n; });
  const allNodes = Object.values(unique);
  
  // Draw lines first
  allNodes.forEach(n => {
    if (n.parentPos) {
      const line = document.createElement('div');
      line.className = 'mm-line';
      
      const x1 = n.x, y1 = n.y;
      const x2 = n.parentPos.x, y2 = n.parentPos.y;
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.sqrt(dx*dx + dy*dy);
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;
      
      line.style.cssText = `
        width: ${len}px;
        height: 2px;
        left: ${x1}px;
        top: ${y1 - 1}px;
        transform: rotate(${angle}deg);
        transform-origin: 0 50%;
        background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,${0.06 + n.depth * 0.03}));
      `;
      canvas.appendChild(line);
    }
  });
  
  // Draw nodes
  allNodes.forEach(n => {
    const el = document.createElement('div');
    el.className = 'mm-node ' + n.type;
    
    let bgColor, borderColor, textColor;
    
    if (n.type === 'center') {
      bgColor = 'rgba(255,215,0,0.12)';
      borderColor = 'rgba(255,215,0,0.3)';
      textColor = '#FFD700';
    } else if (n.type === 'category') {
      bgColor = n.node.color + '22';
      borderColor = n.node.color + '44';
      textColor = n.node.color;
    } else if (n.type === 'file') {
      bgColor = n.node.color + '18';
      borderColor = n.node.color + '33';
      textColor = '#ccc';
    } else {
      bgColor = 'rgba(255,255,255,0.03)';
      borderColor = 'rgba(255,255,255,0.08)';
      textColor = '#888';
    }
    
    el.style.cssText = `
      left: ${n.x}px; top: ${n.y}px;
      background: ${bgColor};
      border-color: ${borderColor};
      color: ${textColor};
      transform: translate(-50%, -50%) scale(1);
    `;
    
    const emoji = n.node.emoji ? '<span class="emoji">' + n.node.emoji + '</span> ' : '';
    el.innerHTML = emoji + n.node.name;
    
    // Click to show sidebar
    if (n.type !== 'center' && n.type !== 'leaf') {
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        showSidebar(n.node, n.type);
      });
    }
    
    el.addEventListener('mouseenter', function() {
      if (!isDragging) {
        this.style.transform = 'translate(-50%, -50%) scale(1.08)';
        this.style.zIndex = '10';
      }
    });
    el.addEventListener('mouseleave', function() {
      this.style.transform = 'translate(-50%, -50%) scale(1)';
      this.style.zIndex = '1';
    });
    
    canvas.appendChild(el);
  });
  
  applyTransform();
}

function showSidebar(node, type) {
  document.getElementById('sbTitle').textContent = (node.emoji || '') + ' ' + node.name;
  document.getElementById('sbSub').textContent = type === 'category' ? 'Category' : 'File';
  document.getElementById('sbSummary').textContent = node.summary || '';
  
  const linkArea = document.getElementById('sbLinkArea');
  if (node.link) {
    linkArea.innerHTML = '<a class="sb-link" href="' + node.link + '" target="_blank">↗ Open in Google Drive</a>';
  } else {
    linkArea.innerHTML = '';
  }
  
  sidebar.classList.add('open');
}

function closeSidebar() {
  sidebar.classList.remove('open');
}

function zoomIn() {
  scale = Math.min(scale * 1.25, 3);
  applyTransform();
}

function zoomOut() {
  scale = Math.max(scale / 1.25, 0.2);
  applyTransform();
}

function applyTransform() {
  canvas.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')';
  document.getElementById('zoomLevel').textContent = Math.round(scale * 100) + '%';
}

function resetView() {
  scale = 1;
  panX = 0;
  panY = 0;
  applyTransform();
}

function toggleLayout() {
  layoutMode = (layoutMode + 1) % 3;
  render();
}

// Canvas pan via drag
canvas.addEventListener('mousedown', (e) => {
  if (e.target === canvas || e.target.classList.contains('mm-line')) {
    isDragging = true;
    startX = e.clientX - panX;
    startY = e.clientY - panY;
  }
});
window.addEventListener('mousemove', (e) => {
  if (isDragging) {
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    applyTransform();
  }
});
window.addEventListener('mouseup', () => { isDragging = false; });

// Touch support
let touchStartX, touchStartY, touchDist = 0;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    touchStartX = e.touches[0].clientX - panX;
    touchStartY = e.touches[0].clientY - panY;
  } else if (e.touches.length === 2) {
    touchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
});
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1) {
    panX = e.touches[0].clientX - touchStartX;
    panY = e.touches[0].clientY - touchStartY;
    applyTransform();
  } else if (e.touches.length === 2) {
    const newDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    scale *= newDist / touchDist;
    touchDist = newDist;
    applyTransform();
  }
}, { passive: false });

// Mouse wheel zoom
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scale = Math.max(0.2, Math.min(3, scale * delta));
  applyTransform();
}, { passive: false });

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') resetView();
  if (e.key === 'l' || e.key === 'L') toggleLayout();
  if (e.key === 'Escape') closeSidebar();
});

// Resize handler
window.addEventListener('resize', () => { render(); });

// Init
render();
</script>
</body>
