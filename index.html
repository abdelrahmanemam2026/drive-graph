<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Hub</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#08080f; color:#e0e0e0; font-family:'Inter',sans-serif; min-height:100vh; }
  .hero { text-align:center; padding:50px 20px 24px; background:linear-gradient(180deg,rgba(255,215,0,0.04) 0%,transparent 100%); }
  .hero h1 { font-size:30px; font-weight:700; color:#fff; margin-bottom:6px; }
  .hero h1 span { color:#FFD700; }
  .hero p { font-size:13px; color:#666; max-width:480px; margin:0 auto; line-height:1.5; }
  .hero .stats { display:flex; gap:20px; justify-content:center; margin-top:12px; font-size:12px; color:#555; }
  .hero .stats strong { color:#888; }
  .search-bar { max-width:1200px; margin:0 auto; padding:0 20px 12px; }
  .search-bar input { width:100%; padding:11px 16px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:10px; color:#eee; font-size:13px; outline:none; font-family:inherit; transition:border .2s; }
  .search-bar input:focus { border-color:rgba(255,215,0,0.3); }
  .search-bar input::placeholder { color:#444; }
  .grid { max-width:1200px; margin:0 auto; padding:0 20px 50px; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .card { background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:18px; cursor:pointer; transition:all .25s; position:relative; overflow:hidden; }
  .card::before { content:''; position:absolute; top:0; left:0; width:100%; height:3px; background:var(--c); opacity:.5; transition:opacity .25s; }
  .card:hover { background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.12); transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,0.3); }
  .card:hover::before { opacity:1; }
  .card .ch { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .card .ci { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .card .cn { font-size:14px; font-weight:600; color:var(--c); }
  .card .cs { font-size:11px; color:#888; line-height:1.4; margin-bottom:8px; }
  .card .csrc { display:flex; flex-wrap:wrap; gap:4px; }
  .card .csrc a, .card .csrc span { font-size:9px; padding:2px 7px; background:rgba(255,255,255,0.04); border-radius:10px; color:#555; text-decoration:none; display:inline-block; transition:all .2s; }
  .card .csrc a:hover { background:rgba(255,255,255,0.08); color:#fff; }
  .empty-state { grid-column:1/-1; text-align:center; padding:40px; color:#555; font-size:14px; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); z-index:900; display:none; }
  .overlay.open { display:block; }
  .panel { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(.95); width:90%; max-width:660px; max-height:85vh; background:#12121e; border:1px solid rgba(255,255,255,0.08); border-radius:18px; z-index:1000; padding:28px 24px; overflow-y:auto; display:none; opacity:0; transition:all .3s; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
  .panel.open { display:block; opacity:1; transform:translate(-50%,-50%) scale(1); }
  .panel .p-x { position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%; border:none; background:rgba(255,255,255,0.06); color:#888; cursor:pointer; font-size:17px; display:flex; align-items:center; justify-content:center; }
  .panel .p-x:hover { background:rgba(255,255,255,0.12); color:#fff; }
  .panel .ph { display:flex; align-items:center; gap:10px; margin-bottom:14px; padding-right:36px; }
  .panel .pi { width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .panel .pt { font-size:20px; font-weight:700; color:var(--c); }
  .panel .ps { font-size:13px; color:#888; line-height:1.5; margin-bottom:16px; padding:10px 14px; background:rgba(255,255,255,0.02); border-radius:8px; border-left:3px solid #FFD700; }
  .panel .psx { font-size:11px; font-weight:600; color:#666; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; margin-top:18px; }
  .panel .pk { list-style:none; padding:0; }
  .panel .pk li { padding:9px 12px; margin-bottom:5px; background:rgba(255,255,255,0.02); border-radius:7px; font-size:12px; line-height:1.5; color:#bbb; border-left:2px solid rgba(255,255,255,0.05); transition:all .2s; }
  .panel .pk li:hover { background:rgba(255,255,255,0.04); border-left-color:var(--c,#FFD700); }
  .panel .pk li::before { content:'\2022'; color:var(--c,#FFD700); margin-right:7px; font-weight:700; }
  .panel .psrc { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; }
  .panel .psrc a { text-decoration:none; display:inline-flex; align-items:center; gap:3px; background:rgba(255,255,255,0.04); padding:3px 10px; border-radius:18px; color:#aaa; font-size:10px; transition:all .2s; }
  .panel .psrc a:hover { background:rgba(255,255,255,0.08); color:#fff; }
  .panel .pconn { display:flex; flex-wrap:wrap; gap:5px; }
  .panel .pconn a { font-size:10px; padding:3px 12px; background:rgba(255,215,0,0.06); border:1px solid rgba(255,215,0,0.12); border-radius:18px; color:#FFD700; cursor:pointer; text-decoration:none; transition:all .2s; }
  .panel .pconn a:hover { background:rgba(255,215,0,0.12); }
  .panel::-webkit-scrollbar { width:4px; }
  .panel::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }
  @media(max-width:700px){ .grid{grid-template-columns:1fr} .panel{width:95%;padding:18px;max-height:90vh} .hero h1{font-size:22px} }
</style>
</head>
<body>
<div class="hero">
  <h1>&#x1F9E0; <span>Knowledge Hub</span></h1>
  <p>Aggregated knowledge from all files concepts, insights, and connections in one place.</p>
  <div class="stats">
    <span><strong>13</strong> concepts</span>
    <span><strong>14</strong> sources</span>
    <span><strong>88</strong> insights</span>
  </div>
</div>
<div class="search-bar"><input id="q" type="text" placeholder="Search concepts, insights, or sources..." oninput="f(this.value)"></div>
<div class="grid" id="g"></div>
<div class="overlay" id="ov" onclick="c()"></div>
<div class="panel" id="pn">
  <button class="p-x" onclick="c()">&#10005;</button>
  <div class="ph"><div class="pi" id="pIcon"></div><div class="pt" id="pTitle"></div></div>
  <div class="ps" id="pSum"></div>
  <div class="psx">&#x1F4A1; Insights & Knowledge</div>
  <ul class="pk" id="pK"></ul>
  <div class="psx" style="margin-top:20px;">&#x1F4C4; Sources</div>
  <div class="psrc" id="pSrc"></div>
  <div class="psx">&#x1F517; Connections</div>
  <div class="pconn" id="pConn"></div>
</div>
<script>
const D = {"concepts": [{"id": "hermes-agent", "name": "Hermes Agent", "color": "#2196F3", "summary": "AI agent framework for automating complex workflows via skills, plugins, cron jobs, and multi-agent orchestration.", "knowledge": ["Hermes Agent is an open-source AI agent framework running in the terminal connecting to Telegram, Discord, and other platforms.", "It features a Skills System for reusable workflows, Plugins for extensibility, Cron Jobs for scheduled automation, and persistent Memory.", "Supports multi-agent orchestration with specialized agents working together via structured JSON handoffs.", "Can be configured via YAML for context limits, sub-agent concurrency, cost optimization, and YOLO mode.", "Integrates with Obsidian for long-term memory by reading, writing, searching, and linking notes automatically.", "Supports Tailscale remote gateways for cross-device agent control.", "Skills can be created for repeatable workflows turning multi-step processes into reusable skills.", "Comparison with Odysseus: Hermes offers advanced customization, Skills, Plugins, Cron Jobs, Memory; Odysseus is simpler."], "sources": ["7_hermes_uses.md", "obsidian_hermes.md", "hermes_config.txt", "hermes_work_graph.md", "odysseus_vs_hermes.md", "managing_ai_agents.md", "ai_content_studio.md"], "connections": ["second-brain", "multi-agent", "tailscale", "self-hosting", "obsidian", "knowledge-graph"], "emoji": "&#x1F916;"}, {"id": "second-brain", "name": "Second Brain", "color": "#9C27B0", "summary": "Persistent knowledge system combining Obsidian notes with AI agents for automated knowledge management.", "knowledge": ["A Second Brain is a personal knowledge management system where ideas and notes are interconnected.", "Combining Obsidian with Hermes Agent creates a knowledge flywheel: more notes lead to better AI context and output.", "Hermes Agent reads, writes, searches, and links notes in your Obsidian vault automatically.", "The Graph Engineer skill in Hermes Work organizes scattered notes into connected Knowledge Graphs.", "Dr. Justin Sung's system: Intention, Environment, Process, Review making productive behavior the default path.", "Knowledge management reduces cognitive load and creates compounding systems.", "Graph organization enables serendipitous discovery across domains."], "sources": ["obsidian_hermes.md", "hermes_work_graph.md", "7_hermes_uses.md", "productivity_systems.md"], "connections": ["hermes-agent", "obsidian", "knowledge-graph", "productivity"], "emoji": "&#x1F9E0;"}, {"id": "multi-agent", "name": "Multi-Agent Systems", "color": "#00BCD4", "summary": "Multiple specialized AI agents working together in orchestrated pipelines for complex autonomous workflows.", "knowledge": ["Multi-agent systems use specialized AI agents each with a single responsibility coordinated by an orchestrator.", "5-agent content studio: Atlas (research), Vera (writing), Kite (design), Orin (publishing), Orchestrator with JSON handoffs.", "Ryan Carson ships 22-40 PRs daily using cloud VMs for 50x parallel output and a self-improvement agent.", "Model routing between AI models reduces token costs from $20K to $5K/month.", "Three must-build automations: signup test, watchdog, and self-improvement loop.", "Managing AI agents is the most valuable skill of 2026 half managed from a phone.", "Each agent does one thing well and passes structured data to the next."], "sources": ["ai_content_studio.md", "managing_ai_agents.md", "odysseus_vs_hermes.md", "7_hermes_uses.md"], "connections": ["hermes-agent", "automation", "self-hosting"], "emoji": "&#x1F91D;"}, {"id": "self-hosting", "name": "Self-Hosting", "color": "#4CAF50", "summary": "Deploying applications and services on your own VPS instead of managed cloud platforms.", "knowledge": ["Coolify is an open-source self-hosted Vercel alternative running on a $5/month VPS with Docker.", "Features: automatic CI/CD from Git push, one-click PostgreSQL, free SSL via Let's Encrypt, one-click rollback.", "A 5-agent content studio runs on a $5/month VPS controlled via Telegram with Tailscale.", "Cloud VM is recommended over local for 50x parallel output in AI operations.", "Self-hosting costs less but requires more technical setup than managed platforms.", "Tailscale provides secure access from any device to agents on a VPS.", "Docker makes self-hosting reproducible with simplified dependency management."], "sources": ["coolify_vercel.md", "ai_content_studio.md", "odysseus_vs_hermes.md", "7_hermes_uses.md"], "connections": ["docker", "tailscale", "multi-agent"], "emoji": "&#x1F680;"}, {"id": "tailscale", "name": "Tailscale", "color": "#8BC34A", "summary": "Secure mesh VPN for connecting devices and enabling remote access to self-hosted services.", "knowledge": ["Tailscale creates a secure WireGuard mesh network connecting all devices, servers, and agents.", "Enables remote gateways to control Hermes Agent on a VPS from any device securely.", "Used in AI content studio for secure dashboard access only Tailnet devices can connect.", "No need to open ports, configure firewalls, or manage SSL for internal services.", "Connect Linux, Windows, phones, and tablets in one private network."], "sources": ["7_hermes_uses.md", "ai_content_studio.md"], "connections": ["self-hosting", "multi-agent", "hermes-agent"], "emoji": "&#x1F517;"}, {"id": "obsidian", "name": "Obsidian", "color": "#7C4DFF", "summary": "Local-first Markdown knowledge base with bi-directional linking and graph visualization.", "knowledge": ["Obsidian is a local-first Markdown note-taking app with bi-directional linking and graph views.", "Integrating with Hermes Agent creates persistent AI long-term memory for reading, writing, and linking notes.", "The knowledge flywheel: more notes give better AI context which produces better output and more notes.", "Local-first means plain Markdown files on your device no vendor lock-in.", "Obsidian's Graph View reveals hidden connections and patterns between notes.", "Bi-directional linking builds an interconnected web of compounding knowledge.", "Knowledge Graphs beat folder hierarchies for organizing information."], "sources": ["obsidian_hermes.md", "hermes_work_graph.md", "7_hermes_uses.md"], "connections": ["second-brain", "knowledge-graph", "hermes-agent"], "emoji": "&#x1F4DA;"}, {"id": "knowledge-graph", "name": "Knowledge Graphs", "color": "#FF9800", "summary": "Visual representation of knowledge as interconnected nodes and edges for learning and discovery.", "knowledge": ["Knowledge Graphs represent information as nodes (concepts) and edges (relationships) enabling non-linear discovery.", "Hermes Work's Graph Engineer creates Knowledge Graphs from scattered notes automatically.", "Graph organization enables serendipitous discovery of cross-domain connections.", "Topics in multiple files act as knowledge bridges between different domains.", "Graph views show which concepts are most connected for exploring related ideas.", "Combined with Obsidian they become powerful learning and research tools."], "sources": ["hermes_work_graph.md", "obsidian_hermes.md", "7_hermes_uses.md"], "connections": ["second-brain", "obsidian", "hermes-agent"], "emoji": "&#x1F50D;"}, {"id": "monetization", "name": "Monetization", "color": "#FF5722", "summary": "Strategies for converting users to paid customers through paywalls, pricing, and payment infrastructure.", "knowledge": ["Paywalls are revenue engines multi-step paywalls show 20-40% uplift over single-screen.", "Value-based pricing is most effective for SaaS over cost-plus or competitor-based.", "Upfront pricing before free trial increases conversion by clarifying commitment.", "Discount gamification (spin-the-wheel, social proof) boosts install-to-paid rates.", "13 gateways compared: Stripe, Paddle, Lemon Squeezy (global), PayMob, Fawry (MENA), USDC (crypto).", "Merchant of Record services handle global tax compliance for solo founders.", "Diversify processors to avoid freeze disruptions use Wise/Payoneer for multi-currency."], "sources": ["paywall_50m.md", "payment_gateways_saas.md", "cold_email_saas.txt"], "connections": ["saas", "email-marketing", "conversion"], "emoji": "&#x1F4B0;"}, {"id": "saas", "name": "SaaS Business", "color": "#795548", "summary": "Software-as-a-Service strategies including payments, cold email, and growth tactics.", "knowledge": ["Cold email for SaaS: 7 steps include data gathering, personalization, AIDA, segmentation, and follow-up.", "Email deliverability requires SPF, DKIM, DMARC records and domain warming before campaigns.", "10 templates: initial outreach, follow-up, social proof, breakup, re-engagement.", "3-7 touchpoints across email, LinkedIn, and phone for maximum conversion.", "AIDA and BANT frameworks structure effective sales messaging.", "MENA founders need local gateways like PayMob alongside global Stripe.", "Multi-channel lead generation: cold email plus LinkedIn plus content plus referrals."], "sources": ["cold_email_saas.txt", "payment_gateways_saas.md", "paywall_50m.md"], "connections": ["monetization", "email-marketing", "conversion"], "emoji": "&#x1F6E0;"}, {"id": "email-marketing", "name": "Email Marketing", "color": "#E91E63", "summary": "Cold email and email marketing strategies for SaaS lead generation and customer acquisition.", "knowledge": ["AIDA, BANT, and CHARM are the three main cold email frameworks.", "3-7 touchpoints across email, LinkedIn, and phone most conversions after follow-up 3.", "Personalized curiosity-driven subject lines outperform generic ones.", "SPF, DKIM, DMARC records and domain warming are essential for deliverability.", "Mention company details and recent events without over-personalizing.", "Breakup emails re-engage cold leads who are still interested."], "sources": ["cold_email_saas.txt"], "connections": ["saas", "monetization"], "emoji": "&#x1F4E7;"}, {"id": "automation", "name": "Automation", "color": "#607D8B", "summary": "Automating tasks, deployments, and self-improvement loops for maximum efficiency.", "knowledge": ["Three must-build automations: signup test, watchdog monitoring, self-improvement loop agent.", "Coolify auto-deploys from Git push for automatic CI/CD.", "Self-improvement agent (Grace) ships ~3 fixes/day by running tests and creating PRs.", "Hermes Cron Jobs automate competitor research, briefings, and social posting.", "Hermes Kanban with Resolver agent reviews tasks automatically.", "Skillification turns multi-step workflows into one-command reusable skills.", "Each automation compounds freeing time for more automation."], "sources": ["managing_ai_agents.md", "coolify_vercel.md", "7_hermes_uses.md"], "connections": ["multi-agent", "hermes-agent"], "emoji": "&#x2699;"}, {"id": "productivity", "name": "Productivity", "color": "#9C27B0", "summary": "Evidence-based productivity frameworks focusing on systems, environment, and cognitive load.", "knowledge": ["Dr. Justin Sung's 4-part system: Intention, Environment, Process, Review.", "Systems over willpower design your path of least resistance for productivity.", "Reduce friction for good habits and increase it for bad ones through environment design.", "Match energy patterns to tasks creative work when energy peaks administrative when low.", "Break complex tasks into chunks use checklists and eliminate decision fatigue.", "Attach new habits to existing ones for automatic execution.", "Weekly reviews assess and adjust the system for continuous improvement."], "sources": ["productivity_systems.md", "7_hermes_uses.md"], "connections": ["second-brain", "hermes-agent"], "emoji": "&#x26A1;"}, {"id": "quran", "name": "Surat Al-Baqarah", "color": "#4CAF50", "summary": "Virtues and impact of Surah Al-Baqarah on a Muslim's life and the honor awaiting its people.", "knowledge": ["Surah Al-Baqarah is the longest Quranic surah. The Prophet said: Taking it is a blessing, leaving it is a regret, sorcerers cannot withstand it.", "It and Surah Al-Imran are Al-Zahrawan (the two luminous ones) they come on Judgment Day like clouds pleading for their companion.", "Blessings: barakah in time, provision, family, work; protection from sorcerers and devils.", "Parents of a Quran memorizer are honored on Judgment Day with a crown.", "The Quran intercedes: Recite and ascend your rank is at the last verse you recite.", "Four stages: recitation, understanding, memorization, application. Every Muslim should have a Mushaf at home.", "Yaqeen (certainty) is higher than tasdeeq (belief) it settles in the heart with full conviction."], "sources": ["surat_albaqarah_fadl.txt", "surah_baqarah_change_life.txt"], "connections": [], "emoji": "&#x1F4D6;"}]};
const U = {"7_hermes_uses.md": "https://drive.google.com/file/d/1JQq0t7iJQXwKlwM_9xYxdsepKRuGRRJO/view", "obsidian_hermes.md": "https://drive.google.com/file/d/1ZpxWtSKOYDwygHV9lI12B089Xm3Ofuuv/view", "hermes_config.txt": "https://drive.google.com/document/d/1M4u5tpNh05-8RpftztBd8v5RsNWK7XzapR0PMrZXqok/edit", "hermes_work_graph.md": "https://drive.google.com/file/d/1l499k9vSFEfXR9-qc-hdphWAP-VuUw4O/view", "odysseus_vs_hermes.md": "https://drive.google.com/file/d/16sFiMQsVaiiiu3BJ7nGK1oDeQuQlcRWy/view", "managing_ai_agents.md": "https://drive.google.com/file/d/1Zi93ODou57S32hRUoWq3m9P1QDEIhC64/view", "ai_content_studio.md": "https://drive.google.com/file/d/1k5VbclAIROpUiYzsV7V54sbfI_acpWV0/view", "productivity_systems.md": "https://drive.google.com/file/d/1G_4j5qZ5pI8AFLQajUJArOdqnQWdBJOR/view", "coolify_vercel.md": "https://drive.google.com/file/d/1Mp6uGod7iMuaSGJbw34zuAX1JG73QiSi/view", "paywall_50m.md": "https://drive.google.com/file/d/1CO2Jee1D-YNE-9sGZkPxtcplXw31n4T2/view", "payment_gateways_saas.md": "https://drive.google.com/file/d/1ivgR_oWyHsoXDH0OjW6gg27qCHFA7UFi/view", "cold_email_saas.txt": "https://drive.google.com/file/d/1ed6zEFXkO2AB27FX9PgT8H1sZU_ztkUg/view", "surat_albaqarah_fadl.txt": "https://drive.google.com/file/d/1l3WGTdKRrJF0DrY7ZeL1-GglnufOvtK2/view", "surah_baqarah_change_life.txt": "https://drive.google.com/file/d/1qE7AiAm90lA-7YFfbosEzqBTRQq34xfb/view"};
const C = D.concepts;
const g = document.getElementById('g');

function render(q) {
  g.innerHTML = '';
  const ql = (q||'').toLowerCase();
  let v = 0;
  C.forEach(c => {
    if (ql && !c.name.toLowerCase().includes(ql) && !c.summary.toLowerCase().includes(ql) && !c.knowledge.some(k=>k.toLowerCase().includes(ql))) return;
    v++;
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--c', c.color);
    const bg = c.color + '1a';
    let srcs = c.sources.slice(0,4).map(s => {
      const u = U[s];
      return u ? '<a href="'+u+'" target="_blank">'+s+'</a>' : '<span>'+s+'</span>';
    }).join('');
    if (c.sources.length > 4) srcs += '<span>+'+(c.sources.length-4)+'</span>';
    card.innerHTML = '<div class="ch"><div class="ci" style="background:'+bg+'">'+c.emoji+'</div><div class="cn">'+c.name+'</div></div><div class="cs">'+c.summary+'</div><div class="csrc">'+srcs+'</div>';
    card.addEventListener('click',()=>open(c));
    g.appendChild(card);
  });
  if (!v) g.innerHTML = '<div class="empty-state">No matching concepts &#x1F50D;</div>';
}

function open(c) {
  const p = document.getElementById('pn');
  p.style.setProperty('--c', c.color);
  const pi = document.getElementById('pIcon');
  pi.style.background = c.color + '1a';
  pi.innerHTML = c.emoji;
  document.getElementById('pTitle').textContent = c.name;
  document.getElementById('pSum').textContent = c.summary;
  document.getElementById('pK').innerHTML = c.knowledge.map(k => '<li>'+k+'</li>').join('');
  document.getElementById('pSrc').innerHTML = c.sources.map(s => {
    const u = U[s];
    return u ? '<a href="'+u+'" target="_blank">&#8599; '+s+'</a>' : '<span>'+s+'</span>';
  }).join('');
  document.getElementById('pConn').innerHTML = c.connections.length
    ? c.connections.map(id => {
        const f = C.find(cc => cc.id === id);
        return f ? '<a onclick="event.stopPropagation();c();setTimeout(()=>openByName(\''+id+'\'),300)">'+f.emoji+' '+f.name+'</a>' : '';
      }).join('')
    : '<span style="color:#555;font-size:11px;">None</span>';
  document.getElementById('ov').classList.add('open');
  p.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openByName(id) {
  const c = C.find(cc => cc.id === id);
  if (c) open(c);
}

function c() {
  document.getElementById('ov').classList.remove('open');
  document.getElementById('pn').classList.remove('open');
  document.body.style.overflow = '';
}

function f(v) { render(v); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') c(); });
render();
</script>
</body>
</html>
