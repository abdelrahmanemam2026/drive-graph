: "protection_from_sorcerers_al-batala", "type": "contains"}, {"source": "surat_albaqarah_fadl", "target": "al-zahrawan_the_two_luminous_surahs:_al-baqarah_+_al-imran", "type": "contains"}, {"source": "surat_albaqarah_fadl", "target": "quran_interceding_for_its_companion_on_judgment_day", "type": "contains"}, {"source": "surat_albaqarah_fadl", "target": "four_learning_stages:_recitation_understanding_memorizatio", "type": "contains"}, {"source": "surah_baqarah_change_life", "target": "surah_al-baqarah_can_change_your_life_and_home", "type": "contains"}, {"source": "surah_baqarah_change_life", "target": "certainty_yaqeen_vs._mere_belief_tasdeeq_in_afterlife_re", "type": "contains"}, {"source": "surah_baqarah_change_life", "target": "parents_honored_through_child's_quran_memorization", "type": "contains"}, {"source": "surah_baqarah_change_life", "target": "ascending_in_paradise_degrees_through_recitation", "type": "contains"}, {"source": "surah_baqarah_change_life", "target": "having_a_mushaf_at_home_and_keeping_it_read_not_decorative", "type": "contains"}, {"source": "surah_baqarah_change_life", "target": "practical_gradual_learning_approach", "type": "contains"}, {"source": "surah_baqarah_change_life", "target": "quran_as_a_companion_welcoming_the_believer_from_the_grave", "type": "contains"}]};

const w = window.innerWidth, h = window.innerHeight;
const svg = d3.select("#graph").append("svg").attr("width", w).attr("height", h);
const g = svg.append("g");

const zoom = d3.zoom().scaleExtent([0.08, 6]).on("zoom", (e) => g.attr("transform", e.transform));
svg.call(zoom);

// Color topic nodes by shared count
data.nodes.forEach(n => {
  if (n.type === "topic") {
    n.color = n.count > 1 ? "#FFEB3B" : "#546E7A";
  }
});

// Links
const link = g.append("g").selectAll("line")
  .data(data.links)
  .join("line")
  .attr("stroke", d => d.type === "shared" ? "rgba(255,215,0,0.15)" : "rgba(255,255,255,0.07)")
  .attr("stroke-width", d => d.type === "shared" ? 1.5 : 0.8)
  .attr("stroke-dasharray", d => d.type === "shared" ? "4,3" : "none");

// Nodes
const node = g.append("g").selectAll("g")
  .data(data.nodes)
  .join("g")
  .call(d3.drag().on("start", (e,d) => { if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag", (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on("end", (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

node.append("circle")
  .attr("r", d => d.r || 10)
  .attr("fill", d => d.color)
  .attr("stroke", d => d.type === "file" ? "rgba(255,255,255,0.2)" : "rgba(255,255,255,0.1)")
  .attr("stroke-width", 1.5)
  .attr("opacity", 0.9);

node.append("text")
  .text(d => d.label)
  .attr("x", d => (d.r || 10) + 6)
  .attr("y", 3)
  .attr("fill", d => d.type === "file" ? "rgba(255,255,255,0.8)" : "rgba(255,255,255,0.5)")
  .attr("font-size", d => d.type === "file" ? 10 : 8)
  .style("pointer-events", "none")
  .style("text-shadow", "0 1px 3px rgba(0,0,0,0.9)");

// Tooltip
const tip = d3.select("#tooltip");
node.on("mouseover", function(e, d) {
  const r = this.getBoundingClientRect();
  let html = '<div class="tt-name">' + (d.type === "file" ? "📄 " : "🏷️ ") + d.fullName + '</div>';
  html += '<div class="tt-meta">' + d.type + (d.category && d.category !== "shared" ? " · " + d.category : "") + '</div>';
  if (d.count && d.count > 1) html += '<div class="tt-files">🔗 ' + d.count + ' files: ' + (d.files || []).join(", ") + '</div>';
  tip.html(html).style("display","block").style("left",(r.left+15)+"px").style("top",(r.top-10)+"px");
  d3.select(this).select("circle").attr("stroke","#fff").attr("stroke-width",2.5);
}).on("mouseout", function(e,d) {
  tip.style("display","none");
  d3.select(this).select("circle").attr("stroke",d.type==="file"?"rgba(255,255,255,0.2)":"rgba(255,255,255,0.1)").attr("stroke-width",1.5);
});

// Simulation
const sim = d3.forceSimulation(data.nodes)
  .force("link", d3.forceLink(data.links).id(d => d.id).distance(d => d.type === "shared" ? 60 : 90))
  .force("charge", d3.forceManyBody().strength(d => d.type === "file" ? -200 : -100))
  .force("center", d3.forceCenter(w/2, h/2))
  .force("collision", d3.forceCollide().radius(d => (d.r||10) + 10))
  .on("tick", () => {
    link.attr("x1", d=>d.source.x).attr("y1", d=>d.source.y).attr("x2", d=>d.target.x).attr("y2", d=>d.target.y);
    node.attr("transform", d=>`translate(${d.x},${d.y})`);
  });

function filterGraph(q) {
  const ql = q.toLowerCase();
  node.style("opacity", d => {
    if (!ql) return 1;
    const match = d.fullName.toLowerCase().includes(ql) || d.label.toLowerCase().includes(ql) || (d.files && d.files.some(f => f.includes(ql)));
    return match ? 1 : 0.08;
  });
  link.style("opacity", d => {
    if (!ql) return d.type === "shared" ? 0.4 : 0.3;
    const findNode = id => data.nodes.find(n => n.id === (typeof id === "object" ? id.id : id));
    const s = findNode(d.source), t = findNode(d.target);
    const sVis = s && (s.fullName.toLowerCase().includes(ql) || s.label.toLowerCase().includes(ql));
    const tVis = t && (t.fullName.toLowerCase().includes(ql) || t.label.toLowerCase().includes(ql));
    return sVis && tVis ? 0.6 : 0.02;
  });
}

function resetZoom() {
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
}
