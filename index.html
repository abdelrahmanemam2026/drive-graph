<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Hub — Interactive Learning</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: #08080f; color: #e0e0e0; font-family: 'Inter', sans-serif; min-height: 100vh; }
  
  /* Hero */
  .hero {
    text-align: center;
    padding: 60px 20px 30px;
    background: linear-gradient(180deg, rgba(255,215,0,0.04) 0%, transparent 100%);
  }
  .hero h1 { font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 8px; }
  .hero h1 span { color: #FFD700; }
  .hero p { font-size: 14px; color: #666; max-width: 500px; margin: 0 auto; line-height: 1.5; }
  .hero .stats { display: flex; gap: 24px; justify-content: center; margin-top: 16px; font-size: 12px; color: #555; }
  .hero .stats strong { color: #888; }
  
  /* Grid */
  .grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }
  
  /* Cards */
  .card {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 3px;
    background: var(--card-color);
    opacity: 0.6;
    transition: opacity 0.25s;
  }
  .card:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.12);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  .card:hover::before { opacity: 1; }
  .card:active { transform: translateY(0); }
  
  .card .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .card .card-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .card .card-name {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
  }
  .card .card-summary {
    font-size: 12px;
    color: #888;
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .card .card-sources {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .card .card-source {
    font-size: 9px;
    padding: 2px 8px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    color: #555;
  }
  .card .card-connections {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .card .card-conn {
    font-size: 9px;
    padding: 2px 8px;
    background: rgba(255,215,0,0.06);
    border-radius: 10px;
    color: #FFD700;
    opacity: 0.5;
  }
  
  /* Expanded card / detail panel */
  .detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 900;
    display: none;
    animation: fadeIn 0.2s ease;
  }
  .detail-overlay.open { display: block; }
  
  .detail-panel {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    width: 90%;
    max-width: 680px;
    max-height: 85vh;
    background: #12121e;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    z-index: 1000;
    padding: 32px 28px;
    overflow-y: auto;
    display: none;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .detail-panel.open {
    display: block;
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  
  .detail-panel .dp-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.06);
    color: #888;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .detail-panel .dp-close:hover { background: rgba(255,255,255,0.12); color: #fff; }
  
  .detail-panel .dp-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-right: 40px;
  }
  .detail-panel .dp-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .detail-panel .dp-title {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
  }
  .detail-panel .dp-summary {
    font-size: 14px;
    color: #888;
    line-height: 1.5;
    margin-bottom: 20px;
    padding: 12px 16px;
    background: rgba(255,255,255,0.02);
    border-radius: 10px;
    border-left: 3px solid var(--dp-color, #FFD700);
  }
  .detail-panel .dp-section {
    font-size: 11px;
    font-weight: 600;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
    margin-top: 20px;
  }
  .detail-panel .dp-knowledge {
    list-style: none;
    padding: 0;
  }
  .detail-panel .dp-knowledge li {
    padding: 10px 14px;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    color: #bbb;
    border-left: 2px solid rgba(255,255,255,0.05);
    transition: all 0.2s;
  }
  .detail-panel .dp-knowledge li:hover {
    background: rgba(255,255,255,0.04);
    border-left-color: var(--dp-color, #FFD700);
  }
  .detail-panel .dp-knowledge li::before {
    content: '•';
    color: var(--dp-color, #FFD700);
    margin-right: 8px;
    font-weight: bold;
  }
  .detail-panel .dp-sources {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .detail-panel .dp-source {
    font-size: 11px;
    padding: 4px 12px;
    background: rgba(255,255,255,0.04);
    border-radius: 20px;
    color: #aaa;
  }
  .detail-panel .dp-connections {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .detail-panel .dp-connection {
    font-size: 11px;
    padding: 4px 14px;
    background: rgba(255,215,0,0.06);
    border: 1px solid rgba(255,215,0,0.12);
    border-radius: 20px;
    color: #FFD700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .detail-panel .dp-connection:hover {
    background: rgba(255,215,0,0.12);
  }
  
  /* Search */
  .search-bar {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .search-bar input {
    width: 100%;
    padding: 12px 18px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: #eee;
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
    font-family: inherit;
  }
  .search-bar input:focus {
    border-color: rgba(255,215,0,0.3);
  }
  .search-bar input::placeholder { color: #444; }
  
  /* Empty state */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px;
    color: #555;
    font-size: 14px;
  }
  
  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  .card:nth-child(1) { animation: fadeIn 0.3s ease both; }
  .card:nth-child(2) { animation: fadeIn 0.3s ease 0.04s both; }
  .card:nth-child(3) { animation: fadeIn 0.3s ease 0.08s both; }
  .card:nth-child(4) { animation: fadeIn 0.3s ease 0.12s both; }
  .card:nth-child(5) { animation: fadeIn 0.3s ease 0.16s both; }
  .card:nth-child(6) { animation: fadeIn 0.3s ease 0.20s both; }
  .card:nth-child(7) { animation: fadeIn 0.3s ease 0.24s both; }
  .card:nth-child(8) { animation: fadeIn 0.3s ease 0.28s both; }
  .card:nth-child(9) { animation: fadeIn 0.3s ease 0.32s both; }
  .card:nth-child(10) { animation: fadeIn 0.3s ease 0.36s both; }
  .card:nth-child(11) { animation: fadeIn 0.3s ease 0.40s both; }
  .card:nth-child(12) { animation: fadeIn 0.3s ease 0.44s both; }
  .card:nth-child(13) { animation: fadeIn 0.3s ease 0.48s both; }
  
  /* Scrollbar */
  .detail-panel::-webkit-scrollbar { width: 4px; }
  .detail-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
    .hero h1 { font-size: 24px; }
    .detail-panel { width: 95%; padding: 20px; max-height: 90vh; }
  }
</style>
</head>
<body>

<div class="hero">
  <h1>?? <span>Knowledge Hub</span></h1>
  <p>Aggregated knowledge from all files — concepts, insights, and connections in one place.</p>
  <div class="stats">
    <span><strong id="conceptCount">0</strong> concepts</span>
    <span><strong id="sourceCount">0</strong> sources</span>
    <span><strong id="insightCount">0</strong> insights</span>
  </div>
</div>

<div class="search-bar">
  <input id="search" type="text" placeholder="Search concepts, insights, or sources..." oninput="filterCards(this.value)">

<div class="grid" id="grid"></div>

<!-- Detail Panel -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel">

  <div class="dp-header">

    <div class="dp-title" id="dpTitle"></div>

  <div class="dp-section">?? Insights & Knowledge</div>

  <div class="dp-sources" id="dpSources"></div>
  
  <div class="dp-section">?? Connections</div>
  <div class="dp-connections" id="dpConnections"></div>
</div>

const sourceUrls = {"7_hermes_uses.md": "https://drive.google.com/file/d/1JQq0t7iJQXwKlwM_9xYxdsepKRuGRRJO/view", "obsidian_hermes.md": "https://drive.google.com/file/d/1ZpxWtSKOYDwygHV9lI12B089Xm3Ofuuv/view", "hermes_config.txt": "https://drive.google.com/document/d/1M4u5tpNh05-8RpftztBd8v5RsNWK7XzapR0PMrZXqok/edit", "hermes_work_graph.md": "https://drive.google.com/file/d/1l499k9vSFEfXR9-qc-hdphWAP-VuUw4O/view", "odysseus_vs_hermes.md": "https://drive.google.com/file/d/16sFiMQsVaiiiu3BJ7nGK1oDeQuQlcRWy/view", "managing_ai_agents.md": "https://drive.google.com/file/d/1Zi93ODou57S32hRUoWq3m9P1QDEIhC64/view", "ai_content_studio.md": "https://drive.google.com/file/d/1k5VbclAIROpUiYzsV7V54sbfI_acpWV0/view", "productivity_systems.md": "https://drive.google.com/file/d/1G_4j5qZ5pI8AFLQajUJArOdqnQWdBJOR/view", "coolify_vercel.md": "https://drive.google.com/file/d/1Mp6uGod7iMuaSGJbw34zuAX1JG73QiSi/view", "paywall_50m.md": "https://drive.google.com/file/d/1CO2Jee1D-YNE-9sGZkPxtcplXw31n4T2/view", "payment_gateways_saas.md": "https://drive.google.com/file/d/1ivgR_oWyHsoXDH0OjW6gg27qCHFA7UFi/view", "cold_email_saas.txt": "https://drive.google.com/file/d/1ed6zEFXkO2AB27FX9PgT8H1sZU_ztkUg/view", "surat_albaqarah_fadl.txt": "https://drive.google.com/file/d/1l3WGTdKRrJF0DrY7ZeL1-GglnufOvtK2/view", "surah_baqarah_change_life.txt": "https://drive.google.com/file/d/1qE7AiAm90lA-7YFfbosEzqBTRQq34xfb/view"};
const concepts = data.concepts;

// Stats
document.getElementById('conceptCount').textContent = concepts.length;
const allSources = new Set();
let totalInsights = 0;
concepts.forEach(c => {
  c.sources.forEach(s => allSources.add(s));
  totalInsights += c.knowledge.length;
});
document.getElementById('sourceCount').textContent = allSources.size;
document.getElementById('insightCount').textContent = totalInsights;

const grid = document.getElementById('grid');

// Color helpers
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function renderCards(filter) {
  grid.innerHTML = '';
  const q = (filter || '').toLowerCase();
  let visible = 0;

  concepts.forEach(c => {
    // Check if matches filter
    if (q) {
      const nameMatch = c.name.toLowerCase().includes(q);
      const insightMatch = c.knowledge.some(k => k.toLowerCase().includes(q));
      const sourceMatch = c.sources.some(s => s.toLowerCase().includes(q));
      const summaryMatch = c.summary.toLowerCase().includes(q);
      if (!nameMatch && !insightMatch && !sourceMatch && !summaryMatch) return;
    }
    visible++;

    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--card-color', c.color);
    
    const bgIcon = hexToRgba(c.color, 0.12);
    const iconBorder = hexToRgba(c.color, 0.2);
    
    card.innerHTML = `
      <div class="card-header">
        <div class="card-icon" style="background:${bgIcon}">
          ${c.emoji}
        </div>
        <div class="card-name" style="color:${c.color}">${c.name}</div>
      </div>
      <div class="card-summary">${c.summary}</div>
      <div class="card-sources">
        ${c.sources.slice(0, 4).map(s => {
          const url = sourceUrls[s];
          return url ? `<a href="${url}" target="_blank" class="card-source" style="text-decoration:none;color:#555;font-size:9px;padding:2px 8px;background:rgba(255,255,255,0.04);border-radius:10px;display:inline-block;transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.08)';this.style.color='#fff'" onmouseout="this.style.background='rgba(255,255,255,0.04)';this.style.color='#555'">↗ ${s}</a>`
            : `<span class="card-source">${s}</span>`;
        }).join('')}
        ${c.sources.length > 4 ? `<span class="card-source">+${c.sources.length - 4}</span>` : ''}
      </div>
      <div class="card-connections">
        ${c.connections.slice(0, 4).map(conn => {
          const found = concepts.find(cc => cc.id === conn);
          return found ? `<span class="card-conn">${found.emoji} ${found.name}</span>` : '';
        }).join('')}
      </div>
    `;
    
    card.addEventListener('click', () => openDetail(c));
    grid.appendChild(card);
  });
  
  if (visible === 0) {
    grid.innerHTML = '<div class="empty-state">No concepts match your search ??</div>';
  }
}

function filterCards(value) {
  renderCards(value);
}

function openDetail(c) {
  const panel = document.getElementById('detailPanel');
  const color = c.color;
  
  panel.style.setProperty('--dp-color', color);
  
  document.getElementById('dpIcon').style.cssText = `background:${hexToRgba(color, 0.12)};`;
  document.getElementById('dpIcon').textContent = c.emoji;
  document.getElementById('dpTitle').textContent = c.name;
  document.getElementById('dpTitle').style.color = color;
  document.getElementById('dpSummary').textContent = c.summary;
  
  // Knowledge items
  const kList = document.getElementById('dpKnowledge');
  kList.innerHTML = c.knowledge.map(k => `<li>${k}</li>`).join('');
  
  // Sources
  document.getElementById('dpSources').innerHTML = c.sources.map(s => {
    const url = sourceUrls[s];
    return url ? `<a href="${url}" target="_blank" class="dp-source" style="text-decoration:none;display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.04);padding:4px 12px;border-radius:20px;color:#aaa;font-size:11px;transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.08)';this.style.color='#fff'" onmouseout="this.style.background='rgba(255,255,255,0.04)';this.style.color='#aaa'">↗ ${s}</a>`
      : `<span class="dp-source">${s}</span>`;
  }).join('');
  
  // Connections
  const connEl = document.getElementById('dpConnections');
  const conns = c.connections.map(connId => {
    const found = concepts.find(cc => cc.id === connId);
    if (!found) return '';
    return `<span class="dp-connection" onclick="event.stopPropagation(); closeDetail(); openDetailByName('${connId}')">${found.emoji} ${found.name}</span>`;
  }).filter(Boolean).join('');
  connEl.innerHTML = conns || '<span style="color:#555;font-size:12px;">No direct connections</span>';
  
  document.getElementById('detailOverlay').classList.add('open');
  panel.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openDetailByName(id) {
  const c = concepts.find(cc => cc.id === id);
  if (c) openDetail(c);
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  document.getElementById('detailPanel').classList.remove('open');
  document.body.style.overflow = '';
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDetail();
});

// Init
renderCards();
</script>
</body>
</html>
