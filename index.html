<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Learning Hub — Interactive</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#08080f; color:#e0e0e0; font-family:'Inter','Tajawal',sans-serif; min-height:100vh; }

  .hero { text-align:center; padding:40px 20px 16px; background:linear-gradient(180deg,rgba(255,215,0,0.04) 0%,transparent 100%); }
  .hero h1 { font-size:28px; font-weight:800; color:#fff; margin-bottom:4px; letter-spacing:-.5px; }
  .hero h1 span { color:#FFD700; }
  .hero p { font-size:13px; color:#666; max-width:500px; margin:0 auto; line-height:1.5; }
  .hero .stats { display:flex; gap:20px; justify-content:center; margin-top:8px; font-size:12px; color:#555; flex-wrap:wrap; }
  .hero .stats strong { color:#888; }

  .tabs { display:flex; max-width:1200px; margin:0 auto; padding:0 20px; gap:4px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { padding:10px 18px; border-radius:10px 10px 0 0; cursor:pointer; font-size:13px; font-weight:500; white-space:nowrap; transition:all .2s; opacity:.5; border:none; background:transparent; color:#aaa; font-family:inherit; }
  .tab:hover { opacity:.8; background:rgba(255,255,255,0.03); }
  .tab.active { opacity:1; background:rgba(255,255,255,0.04); color:#fff; border-bottom:2px solid var(--tab-color); }
  .tab .badge { font-size:10px; background:rgba(255,255,255,0.08); padding:1px 7px; border-radius:8px; margin-left:6px; color:#888; }

  .search-bar { max-width:1200px; margin:0 auto; padding:0 20px 10px; }
  .search-bar input { width:100%; padding:10px 16px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:10px; color:#eee; font-size:13px; outline:none; font-family:inherit; transition:border .2s; }
  .search-bar input:focus { border-color:rgba(255,215,0,0.3); }
  .search-bar input::placeholder { color:#444; }

  .grid { max-width:1200px; margin:0 auto; padding:0 20px 30px; display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  .card { background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:18px; cursor:pointer; transition:all .25s; position:relative; overflow:hidden; }
  .card::before { content:''; position:absolute; top:0; left:0; width:100%; height:3px; background:var(--c); opacity:.5; transition:opacity .25s; }
  .card:hover { background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.12); transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,0.3); }
  .card:hover::before { opacity:1; }
  .card .ch { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .card .ci { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .card .cn { font-size:14px; font-weight:600; color:var(--c); }
  .card .cn[dir="rtl"] { font-family:'Tajawal',sans-serif; }
  .card .cs { font-size:11px; color:#888; line-height:1.4; margin-bottom:6px; }
  .card .cs[dir="rtl"] { font-family:'Tajawal',sans-serif; }
  .card .badges { display:flex; gap:4px; flex-wrap:wrap; }
  .card .badges .b { font-size:9px; padding:2px 8px; border-radius:8px; font-weight:500; letter-spacing:.3px; }
  .card .badges .b-flash { background:rgba(255,215,0,0.08); color:#FFD700; }
  .card .badges .b-lang { background:rgba(255,255,255,0.04); color:#888; }
  .empty-state { grid-column:1/-1; text-align:center; padding:40px; color:#555; font-size:14px; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); z-index:900; display:none; }
  .overlay.open { display:block; }
  .panel { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(.95); width:90%; max-width:660px; max-height:85vh; background:#12121e; border:1px solid rgba(255,255,255,0.08); border-radius:18px; z-index:1000; padding:28px 24px; overflow-y:auto; display:none; opacity:0; transition:all .3s; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
  .panel.open { display:block; opacity:1; transform:translate(-50%,-50%) scale(1); }
  .panel .p-x { position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%; border:none; background:rgba(255,255,255,0.06); color:#888; cursor:pointer; font-size:17px; display:flex; align-items:center; justify-content:center; }
  .panel .p-x:hover { background:rgba(255,255,255,0.12); color:#fff; }
  .panel .ph { display:flex; align-items:center; gap:10px; margin-bottom:10px; padding-right:36px; }
  .panel .pi { width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .panel .pt { font-size:20px; font-weight:700; color:var(--c); }
  .panel .pt[dir="rtl"] { font-family:'Tajawal',sans-serif; }
  .panel .ps { font-size:13px; color:#888; line-height:1.5; margin-bottom:12px; padding:10px 14px; background:rgba(255,255,255,0.02); border-radius:8px; border-left:3px solid #FFD700; }
  .panel .ps[dir="rtl"] { border-left:none; border-right:3px solid #FFD700; font-family:'Tajawal',sans-serif; }

  .panel-tabs { display:flex; gap:2px; margin-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.06); }
  .panel-tab { padding:8px 16px; cursor:pointer; font-size:12px; font-weight:500; color:#888; border:none; background:none; font-family:inherit; transition:all .2s; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .panel-tab:hover { color:#bbb; }
  .panel-tab.active { color:var(--c); border-bottom-color:var(--c); }
  .panel-tab-content { display:none; }
  .panel-tab-content.active { display:block; }

  .pk { list-style:none; padding:0; }
  .pk li { padding:9px 12px; margin-bottom:4px; background:rgba(255,255,255,0.02); border-radius:7px; font-size:12px; line-height:1.5; color:#bbb; border-left:2px solid rgba(255,255,255,0.05); transition:all .2s; }
  .pk li:hover { background:rgba(255,255,255,0.04); border-left-color:var(--c,#FFD700); }
  .pk li::before { content:'\2022'; color:var(--c,#FFD700); margin-right:7px; font-weight:700; }
  .pk li[dir="rtl"] { border-left:none; border-right:2px solid rgba(255,255,255,0.05); font-family:'Tajawal',sans-serif; }
  .pk li[dir="rtl"]:hover { border-right-color:var(--c,#FFD700); }

  .psrc { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; margin-top:8px; }
  .psrc a { text-decoration:none; display:inline-flex; align-items:center; gap:3px; background:rgba(255,255,255,0.04); padding:3px 10px; border-radius:18px; color:#aaa; font-size:10px; transition:all .2s; }
  .psrc a:hover { background:rgba(255,255,255,0.08); color:#fff; }
  .psx { font-size:11px; font-weight:600; color:#666; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; margin-top:14px; }

  .fc { background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:24px; min-height:140px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:all .3s; position:relative; }
  .fc:hover { background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.12); }
  .fc .fc-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:#666; margin-bottom:8px; }
  .fc .fc-text { font-size:16px; font-weight:500; text-align:center; max-width:450px; line-height:1.5; color:#eee; }
  .fc .fc-text[dir="rtl"] { font-family:'Tajawal',sans-serif; }
  .fc .fc-hint { font-size:11px; color:#555; margin-top:10px; }
  .fc .fc-emoji { font-size:32px; margin-bottom:8px; }
  .fc .fc-count { position:absolute; bottom:8px; right:12px; font-size:10px; color:#444; }
  .fc-buttons { display:none; gap:8px; margin-top:14px; justify-content:center; flex-wrap:wrap; }
  .fc-buttons.show { display:flex; }
  .fc-btn { padding:8px 22px; border-radius:10px; border:none; cursor:pointer; font-size:12px; font-weight:600; transition:all .2s; font-family:inherit; }
  .fc-btn:hover { transform:translateY(-1px); }
  .fc-btn-easy { background:rgba(76,175,80,0.15); color:#4CAF50; border:1px solid rgba(76,175,80,0.25); }
  .fc-btn-easy:hover { background:rgba(76,175,80,0.25); }
  .fc-btn-medium { background:rgba(255,193,7,0.15); color:#FFC107; border:1px solid rgba(255,193,7,0.25); }
  .fc-btn-medium:hover { background:rgba(255,193,7,0.25); }
  .fc-btn-hard { background:rgba(244,67,54,0.15); color:#F44336; border:1px solid rgba(244,67,54,0.25); }
  .fc-btn-hard:hover { background:rgba(244,67,54,0.25); }
  .fc-progress { display:flex; gap:4px; margin-bottom:12px; justify-content:center; }
  .fc-dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.08); }
  .fc-dot.done { background:var(--c,#FFD700); }
  .fc-dot.current { background:var(--c,#FFD700); box-shadow:0 0 6px var(--c,#FFD700); }
  .fc-stats { font-size:11px; color:#555; text-align:center; margin-bottom:8px; }

  .graph-container { width:100%; height:320px; background:rgba(0,0,0,0.2); border-radius:10px; overflow:hidden; position:relative; }
  .graph-container svg { width:100%; height:100%; }
  .graph-container .graph-label { position:absolute; top:10px; left:12px; font-size:10px; color:#555; }
  .graph-tooltip { position:fixed; display:none; background:rgba(0,0,0,0.9); backdrop-filter:blur(8px); padding:8px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); font-size:12px; z-index:1100; pointer-events:none; }
  .graph-tooltip .gt-name { font-weight:600; }

  .pconn { display:flex; flex-wrap:wrap; gap:4px; }
  .pconn a { font-size:10px; padding:3px 12px; background:rgba(255,215,0,0.06); border:1px solid rgba(255,215,0,0.12); border-radius:18px; color:#FFD700; cursor:pointer; text-decoration:none; transition:all .2s; }
  .pconn a:hover { background:rgba(255,215,0,0.12); }

  .panel::-webkit-scrollbar { width:4px; }
  .panel::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }
  @media(max-width:700px){ .grid{grid-template-columns:1fr} .panel{width:95%;padding:18px;max-height:90vh} .hero h1{font-size:22px} .tab{padding:8px 12px;font-size:12px} }
</style>
</head>
<body>

<div class="hero">
  <h1>🧠 <span>Knowledge Learning Hub</span></h1>
  <p>Interactive learning platform — explore concepts, master with flashcards, discover connections.</p>
  <div class="stats">
    <span><strong>18</strong> concepts</span>
    <span><strong>4</strong> sections</span>
    <span><strong>39</strong> flashcards</span>
    <span><strong>14</strong> sources</span>
  </div>
</div>

<div class="tabs" id="tabs"></div>

<div class="search-bar"><input id="q" type="text" placeholder="Search concepts, insights, or flashcards across all sections..." oninput="doSearch(this.value)"></div>

<div class="grid" id="g"></div>

<div class="overlay" id="ov" onclick="closePanel()"></div>

<div class="panel" id="pn">
  <button class="p-x" onclick="closePanel()">&#10005;</button>
  <div class="ph"><div class="pi" id="pIcon"></div><div class="pt" id="pTitle"></div></div>
  <div class="ps" id="pSum"></div>

  <div class="panel-tabs" id="pTabs">
    <button class="panel-tab active" data-tab="info" onclick="switchPanelTab(this,'info')">&#x1F4A1; Knowledge</button>
    <button class="panel-tab" data-tab="flash" onclick="switchPanelTab(this,'flash')">&#x1F0CF; Flashcards</button>
    <button class="panel-tab" data-tab="graph" onclick="switchPanelTab(this,'graph')">&#x1F517; Graph</button>
  </div>

  <div class="panel-tab-content active" id="tabInfo">
    <ul class="pk" id="pK"></ul>
    <div class="psx">&#x1F4C4; Sources</div>
    <div class="psrc" id="pSrc"></div>
    <div class="psx" style="margin-top:16px;">&#x1F517; Connections</div>
    <div class="pconn" id="pConn"></div>
  </div>

  <div class="panel-tab-content" id="tabFlash">
    <div class="fc-stats" id="fcStats"></div>
    <div class="fc-progress" id="fcProgress"></div>
    <div class="fc" id="fcCard" onclick="fcReveal()">
      <div class="fc-emoji" id="fcEmoji">&#x1F0CF;</div>
      <div class="fc-label" id="fcLabel">QUESTION</div>
      <div class="fc-text" id="fcText">Click to start</div>
      <div class="fc-hint" id="fcHint">Click to reveal answer</div>
      <div class="fc-count" id="fcCount">0/0</div>
    </div>
    <div class="fc-buttons" id="fcBtns">
      <button class="fc-btn fc-btn-hard" onclick="fcRate(1)">&#x1F534; Hard</button>
      <button class="fc-btn fc-btn-medium" onclick="fcRate(2)">&#x1F7E1; Medium</button>
      <button class="fc-btn fc-btn-easy" onclick="fcRate(3)">&#x1F7E2; Easy</button>
    </div>
  </div>

  <div class="panel-tab-content" id="tabGraph">
    <div class="graph-container" id="pGraph"><div class="graph-label">Loading graph...</div></div>
  </div>
</div>

<div class="graph-tooltip" id="graphTooltip"><div class="gt-name"></div></div>

class SRS {
  static getKey(cid, idx) { return 'srs_'+cid+'_'+idx; }
  static getCard(cid, idx) {
    const raw = localStorage.getItem(this.getKey(cid, idx));
    if (raw) return JSON.parse(raw);
    return { conceptId: cid, cardIdx: idx, ease: 2.5, interval: 0, reps: 0, nextReview: 0 };
  }
  static saveCard(card) { localStorage.setItem(this.getKey(card.conceptId, card.cardIdx), JSON.stringify(card)); }
  static review(card, quality) {
    const q = quality;
    if (q >= 2) {
      card.reps += 1;
      if (card.reps === 1) card.interval = 1;
      else if (card.reps === 2) card.interval = 6;
      else card.interval = Math.round(card.interval * card.ease);
    } else {
      card.reps = 0; card.interval = 0;
    }
    card.ease = Math.max(1.3, card.ease + (0.1 - (2 - q) * (0.08 + (2 - q) * 0.02)));
    card.nextReview = Date.now() + card.interval * 86400000;
    this.saveCard(card);
    return card;
  }
  static getDueCards(cid, total) {
    const now = Date.now();
    const due = [];
    for (let i = 0; i < total; i++) {
      const card = this.getCard(cid, i);
      if (card.nextReview <= now || card.reps === 0) due.push({...card, idx: i});
    }
    return due;
  }
  static getStats(cid, total) {
    let mature = 0, learning = 0, newC = 0;
    for (let i = 0; i < total; i++) {
      const card = this.getCard(cid, i);
      if (card.reps === 0) newC++;
      else if (card.reps >= 3) mature++;
      else learning++;
    }
    return { total, mature, learning, new: newC };
  }
  static reset(cid, total) {
    for (let i = 0; i < total; i++) localStorage.removeItem(this.getKey(cid, i));
  }
}

let activeSection = SECTIONS[0].id;
let currentFilter = '';
let currentConcept = null;
let fcState = { cards: [], idx: 0, revealed: false };

function render() { renderTabs(); renderGrid(); }

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = SECTIONS.map(s =>
    '<button class="tab'+(s.id===activeSection?' active':'')+'" style="--tab-color:'+s.color+'" onclick="switchSection(\''+s.id+'\')">'
    +s.icon+' '+s.name_en+'<span class="badge">'+CONCEPTS.filter(c=>c.section===s.id).length+'</span></button>'
  ).join('');
}

function renderGrid() {
  const el = document.getElementById('g');
  const q = currentFilter.toLowerCase();
  const filtered = CONCEPTS.filter(c => {
    if (activeSection !== 'all' && c.section !== activeSection) return false;
    if (!q) return true;
    return c.name.toLowerCase().includes(q) || c.summary.text.toLowerCase().includes(q) || c.knowledge.some(k => k.text.toLowerCase().includes(q));
  });
  if (!filtered.length) { el.innerHTML = '<div class="empty-state">&#x1F50D; No matching concepts found</div>'; return; }
  el.innerHTML = filtered.map(c => {
    const dir = c.name.match(/[\u0600-\u06FF]/) ? 'rtl' : 'ltr';
    const langLabel = c.knowledge.some(k => k.lang === 'ar') ? 'AR' : 'EN';
    return '<div class="card" style="--c:'+c.color+'" onclick="openConcept(\''+c.id+'\')">'
      +'<div class="ch"><div class="ci" style="background:'+c.color+'1a">'+c.emoji+'</div><div class="cn" dir="'+dir+'">'+c.name+'</div></div>'
      +'<div class="cs" dir="'+dir+'">'+c.summary.text+'</div>'
      +'<div class="badges"><span class="b b-flash">&#x1F0CF; '+c.flashcards.length+' cards</span><span class="b b-lang">'+langLabel+'</span></div>'
      +'</div>';
  }).join('');
}

function switchSection(id) { activeSection = id; currentFilter = ''; document.getElementById('q').value = ''; render(); }

function doSearch(v) { currentFilter = v; renderGrid(); }

function openConcept(id) {
  const c = CONCEPTS.find(x => x.id === id);
  if (!c) return;
  currentConcept = c;
  const p = document.getElementById('pn');
  p.style.setProperty('--c', c.color);
  const pi = document.getElementById('pIcon');
  pi.style.background = c.color + '1a';
  pi.innerHTML = c.emoji;
  const dir = c.name.match(/[\u0600-\u06FF]/) ? 'rtl' : 'ltr';
  document.getElementById('pTitle').textContent = c.name;
  document.getElementById('pTitle').dir = dir;
  document.getElementById('pSum').textContent = c.summary.text;
  document.getElementById('pSum').dir = c.summary.lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('pSum').style.fontFamily = c.summary.lang === 'ar' ? "'Tajawal',sans-serif" : '';

  document.getElementById('pK').innerHTML = c.knowledge.map(k =>
    '<li dir="'+(k.lang==='ar'?'rtl':'ltr')+'"'+(k.lang==='ar'?" style=\"font-family:'Tajawal',sans-serif;\"":'')+'>'+k.text+'</li>'
  ).join('');

  document.getElementById('pSrc').innerHTML = c.sources.map(s => {
    const u = SOURCES[s];
    return u ? '<a href="'+u+'" target="_blank">&#8599; '+s+'</a>' : '<span>'+s+'</span>';
  }).join('');

  const conns = c.connections.map(iid => CONCEPTS.find(x => x.id === iid)).filter(x => x && x.section === c.section);
  document.getElementById('pConn').innerHTML = conns.length
    ? conns.map(f => '<a onclick="event.stopPropagation();closePanel();setTimeout(function(){openConcept(\''+f.id+'\')},300)">'+f.emoji+' '+f.name+'</a>').join('')
    : '<span style="color:#555;font-size:11px;">No connections in this section</span>';

  switchPanelTab(document.querySelector('.panel-tab'), 'info');
  document.getElementById('ov').classList.add('open');
  p.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePanel() {
  document.getElementById('ov').classList.remove('open');
  document.getElementById('pn').classList.remove('open');
  document.body.style.overflow = '';
}

function switchPanelTab(btn, tab) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel-tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');
  if (tab === 'flash' && currentConcept) initFlashcards();
  if (tab === 'graph' && currentConcept) renderSectionGraph();
}

function initFlashcards() {
  const c = currentConcept;
  if (!c || !c.flashcards.length) return;
  const due = SRS.getDueCards(c.id, c.flashcards.length);
  const cards = due.length > 0 ? due : c.flashcards.map(function(_, i) { return {...SRS.getCard(c.id, i), idx: i}; });
  fcState = { cards: cards, idx: 0, revealed: false };
  const stats = SRS.getStats(c.id, c.flashcards.length);
  document.getElementById('fcStats').textContent = '\uD83D\uDCCA '+stats.mature+' mature \u00B7 '+stats.learning+' learning \u00B7 '+stats.new+' new';
  showFcCard();
}

function showFcCard() {
  if (fcState.cards.length === 0) {
    document.getElementById('fcEmoji').textContent = '\uD83C\uDF89';
    document.getElementById('fcLabel').textContent = 'ALL DONE';
    document.getElementById('fcText').textContent = 'All flashcards reviewed! Come back later.';
    document.getElementById('fcHint').textContent = 'Great job! \uD83C\uDF89';
    document.getElementById('fcCount').textContent = '\u2713';
    document.getElementById('fcBtns').classList.remove('show');
    return;
  }
  fcState.revealed = false;
  const card = fcState.cards[fcState.idx];
  const fc = currentConcept.flashcards[card.idx];
  document.getElementById('fcEmoji').textContent = '\uD83C\uDCCF';
  document.getElementById('fcLabel').textContent = 'QUESTION';
  document.getElementById('fcText').innerHTML = '<span dir="'+(fc.q.lang==='ar'?'rtl':'ltr')+'"'+(fc.q.lang==='ar'?" style=\"font-family:'Tajawal',sans-serif;\"":'')+'>'+fc.q.text+'</span>';
  document.getElementById('fcHint').textContent = '\uD83D\uDC46 Click to reveal answer';
  document.getElementById('fcBtns').classList.remove('show');
  document.getElementById('fcCount').textContent = (fcState.idx+1)+'/'+fcState.cards.length;
  document.getElementById('fcProgress').innerHTML = fcState.cards.map(function(_, i) {
    return '<div class="fc-dot'+(i<fcState.idx?' done':'')+(i===fcState.idx?' current':'')+'"></div>';
  }).join('');
}

function fcReveal() {
  if (!fcState.cards.length || fcState.revealed) return;
  fcState.revealed = true;
  const card = fcState.cards[fcState.idx];
  const fc = currentConcept.flashcards[card.idx];
  document.getElementById('fcEmoji').textContent = '\uD83D\uDCA1';
  document.getElementById('fcLabel').textContent = 'ANSWER';
  document.getElementById('fcText').innerHTML = '<span dir="'+(fc.a.lang==='ar'?'rtl':'ltr')+'"'+(fc.a.lang==='ar'?" style=\"font-family:'Tajawal',sans-serif;\"":'')+'>'+fc.a.text+'</span>';
  document.getElementById('fcHint').textContent = 'How well did you know this?';
  document.getElementById('fcBtns').classList.add('show');
}

function fcRate(quality) {
  if (!fcState.revealed) return;
  SRS.review(fcState.cards[fcState.idx], quality);
  fcState.idx++;
  if (fcState.idx >= fcState.cards.length) {
    initFlashcards();
  } else {
    showFcCard();
  }
}

function renderSectionGraph() {
  const c = currentConcept;
  if (!c) return;
  const data = GRAPHS[c.section];
  if (!data || !data.nodes || data.nodes.length < 2) {
    document.querySelector('#pGraph').innerHTML = '<div class="graph-label">Not enough concepts for graph</div>';
    return;
  }
  setTimeout(function() { runD3Graph(data, c.id); }, 50);
}

function runD3Graph(data, highlightId) {
  const container = document.getElementById('pGraph');
  if (!container) return;
  container.innerHTML = '<div class="graph-label">Section Knowledge Graph</div>';

  var width = container.clientWidth || 600;
  var height = container.clientHeight || 300;

  var svg = d3.select(container).append('svg').attr('width', width).attr('height', height);
  var g = svg.append('g');

  svg.call(d3.zoom().scaleExtent([0.3, 3]).on('zoom', function(event) {
    g.attr('transform', event.transform);
  }));

  var nodes = data.nodes.map(function(n) { return Object.assign({}, n); });
  var edges = data.edges.map(function(e) { return {source: e.source, target: e.target}; });

  var sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id(function(d) { return d.id; }).distance(80))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collision', d3.forceCollide(30));

  var link = g.append('g').selectAll('line').data(edges).join('line')
    .attr('stroke', 'rgba(255,255,255,0.1)').attr('stroke-width', 1);

  var node = g.append('g').selectAll('g').data(nodes).join('g')
    .call(d3.drag()
      .on('start', function(e, d) { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', function(e, d) { d.fx = e.x; d.fy = e.y; })
      .on('end', function(e, d) { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  node.append('circle')
    .attr('r', function(d) { return d.id === highlightId ? 20 : 14; })
    .attr('fill', function(d) { return d.color; })
    .attr('stroke', function(d) { return d.id === highlightId ? '#FFD700' : 'rgba(255,255,255,0.2)'; })
    .attr('stroke-width', function(d) { return d.id === highlightId ? 3 : 1.5; });

  node.append('text')
    .text(function(d) { return d.emoji; })
    .attr('x', -7).attr('y', 5)
    .attr('font-size', function(d) { return d.id === highlightId ? 18 : 13; });

  var tooltip = document.getElementById('graphTooltip');
  node.on('mouseover', function(event, d) {
    tooltip.querySelector('.gt-name').textContent = d.name;
    tooltip.style.display = 'block';
    tooltip.style.left = (event.pageX + 15) + 'px';
    tooltip.style.top = (event.pageY - 5) + 'px';
  }).on('mouseout', function() { tooltip.style.display = 'none'; })
    .on('click', function(event, d) {
      if (d.id !== highlightId) { closePanel(); setTimeout(function() { openConcept(d.id); }, 300); }
    });

  sim.on('tick', function() {
    link.attr('x1', function(d) { return d.source.x; }).attr('y1', function(d) { return d.source.y; })
        .attr('x2', function(d) { return d.target.x; }).attr('y2', function(d) { return d.target.y; });
    node.attr('transform', function(d) { return 'translate('+d.x+','+d.y+')'; });
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closePanel();
  if (e.key === ' ' && document.getElementById('pn').classList.contains('open')) {
    e.preventDefault();
    if (!fcState.revealed) fcReveal();
  }
});

render();
window.addEventListener('resize', function() {
  if (currentConcept) renderSectionGraph();
});
</script>
