const zoom = d3.zoom().scaleExtent([0.08, 8]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

// Lookup maps
const nodeMap = {};
data.nodes.forEach(n => nodeMap[n.id] = n);
const linkMap = {};
data.links.forEach(l => {
  const sid = typeof l.source === 'object' ? l.source.id : l.source;
  const tid = typeof l.target === 'object' ? l.target.id : l.target;
  if (!linkMap[sid]) linkMap[sid] = [];
  if (!linkMap[tid]) linkMap[tid] = [];
  linkMap[sid].push({target: tid, type: l.type, topic: l.topic});
  linkMap[tid].push({target: sid, type: l.type, topic: l.topic});
});

const link = g.append("g").selectAll("line")
  .data(data.links).join("line")
  .attr("stroke", d => d.type === "shared" ? "rgba(255,215,0,0.12)" : "rgba(255,255,255,0.06)")
  .attr("stroke-width", d => d.type === "shared" ? 1.8 : 0.8)
  .attr("stroke-dasharray", d => d.type === "shared" ? "5,4" : "none");

const node = g.append("g").selectAll("g")
  .data(data.nodes).join("g")
  .call(d3.drag()
    .on("start", (e,d) => { if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag", (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on("end", (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

node.append("circle")
  .attr("r", d => d.r || 10)
  .attr("fill", d => d.color)
  .attr("stroke", d => d.type === "file" ? "rgba(255,255,255,0.15)" : "rgba(255,255,255,0.08)")
  .attr("stroke-width", 1.5)
  .attr("opacity", 0.85);

node.append("text")
  .text(d => d.emoji ? d.emoji + ' ' + d.label : d.label)
  .attr("x", d => (d.r || 10) + 8)
  .attr("y", 4)
  .attr("fill", d => d.type === "file" ? "rgba(255,255,255,0.7)" : "rgba(255,255,255,0.4)")
  .attr("font-size", d => d.type === "file" ? 11 : 9)
  .attr("font-weight", d => d.type === "file" ? 500 : 400)
  .style("pointer-events", "none")
  .style("text-shadow", "0 1px 4px rgba(0,0,0,0.9)");

// Hover highlighting
node.on("mouseenter", function(e, d) {
  const connected = new Set();
  if (linkMap[d.id]) linkMap[d.id].forEach(l => connected.add(l.target));
  node.attr("opacity", n => n.id === d.id ? 1 : (connected.has(n.id) ? 1 : 0.12));
  link.attr("opacity", l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    if (sid === d.id || tid === d.id) return 0.6;
    if (connected.has(sid) && connected.has(tid)) return 0.3;
    return 0.04;
  });
}).on("mouseleave", function() {
  node.attr("opacity", 0.85);
  link.attr("opacity", l => l.type === "shared" ? 0.3 : 0.15);
}).on("click", function(e, d) { openSidebar(d); });

// Force simulation
const sim = d3.forceSimulation(data.nodes)
  .force("link", d3.forceLink(data.links).id(d => d.id).distance(d => d.type === "shared" ? 50 : 80))
  .force("charge", d3.forceManyBody().strength(d => d.type === "file" ? -180 : -80))
  .force("center", d3.forceCenter(w/2, h/2))
  .force("collision", d3.forceCollide().radius(d => (d.r||10) + 12))
  .on("tick", () => {
    link.attr("x1", d=>d.source.x).attr("y1", d=>d.source.y).attr("x2", d=>d.target.x).attr("y2", d=>d.target.y);
    node.attr("transform", d=>"translate("+d.x+","+d.y+")");
  });

// ===== INTERACTIVITY =====

function filterGraph(q) {
  const ql = q.toLowerCase();
  node.style("opacity", d => {
    if (!ql) return 1;
    const match = (d.fullName && d.fullName.toLowerCase().includes(ql)) ||
                  (d.label && d.label.toLowerCase().includes(ql)) ||
                  (d.topics && d.topics.some(t => t.toLowerCase().includes(ql))) ||
                  (d.id && d.id.toLowerCase().includes(ql));
    return match ? 1 : 0.05;
  });
  link.style("opacity", l => {
    if (!ql) return l.type === "shared" ? 0.3 : 0.15;
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    const s = nodeMap[sid], t = nodeMap[tid];
    const inQ = n => n && ((n.fullName && n.fullName.toLowerCase().includes(ql)) || (n.label && n.label.toLowerCase().includes(ql)));
    return (s && t && (inQ(s) || inQ(t))) ? 0.5 : 0.02;
  });
}

function filterCategory(cat) {
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  node.style("opacity", d => {
    if (cat === "all") return 1;
    if (cat === "shared") return d.shared ? 1 : (d.type === "file" ? 1 : 0.05);
    return d.category === cat ? 1 : 0.05;
  });
  link.style("opacity", l => {
    if (cat === "all") return l.type === "shared" ? 0.3 : 0.15;
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    const s = nodeMap[sid], t = nodeMap[tid];
    const sVis = s && (cat === "shared" ? true : (s.category === cat || s.shared));
    const tVis = t && (cat === "shared" ? true : (t.category === cat || t.shared));
    return sVis && tVis ? (l.type === "shared" ? 0.4 : 0.2) : 0.02;
  });
}

function openSidebar(d) {
  const sb = document.getElementById('sidebar');
  document.getElementById('sb-type').textContent = d.type === "file" ? "\uD83D\uDCC4 File" : "\uD83C\uDFF7\uFE0F Concept";
  document.getElementById('sb-title').textContent = (d.emoji || '') + ' ' + d.fullName;
  document.getElementById('sb-category').textContent = d.category || '';

  const summaryEl = document.getElementById('sb-summary');
  if (d.type === "file" && d.summary) {
    summaryEl.textContent = d.summary;
    summaryEl.style.display = 'block';
  } else if (d.type === "topic") {
    const cnt = d.count || 0;
    summaryEl.textContent = cnt > 1 ? "This concept appears in " + cnt + " files, creating a knowledge bridge." : "This concept appears in 1 file.";
    summaryEl.style.display = 'block';
  } else {
    summaryEl.style.display = 'none';
  }

  const topicsSection = document.getElementById('sb-topics-section');
  const topicsEl = document.getElementById('sb-topics');
  if (d.type === "file" && d.topics && d.topics.length) {
    topicsSection.style.display = 'block';
    topicsEl.innerHTML = d.topics.map(t => {
      const slug = t.toLowerCase().replace(/ /g,'_').replace(/[\/\-']/g,'').substring(0,50);
      return '<span class="sb-topic" onclick="highlightTopic(\'' + slug + '\')">' + t + '</span>';
    }).join('');
  } else {
    topicsSection.style.display = 'none';
  }

  const filesSection = document.getElementById('sb-files-section');
  const filesEl = document.getElementById('sb-files');
  if (d.type === "topic" && d.files && d.files.length) {
    filesSection.style.display = 'block';
    filesEl.innerHTML = d.files.map(fid => {
      const f = nodeMap[fid];
      return f ? '<div class="sb-related-item" onclick="highlightFile(\'' + fid + '\')">\uD83D\uDCC4 ' + f.fullName + '</div>' : '';
    }).join('');
  } else {
    filesSection.style.display = 'none';
  }

  const relatedSection = document.getElementById('sb-related-section');
  const relatedEl = document.getElementById('sb-related');
  if (d.type === "file" && linkMap[d.id]) {
    const seen = new Set();
    const related = [];
    linkMap[d.id].forEach(l => {
      if (l.type === "shared" && !seen.has(l.target)) {
        seen.add(l.target);
        const fn = nodeMap[l.target];
        if (fn && fn.type === "file") related.push(fn);
      }
    });
    if (related.length) {
      relatedSection.style.display = 'block';
      relatedEl.innerHTML = related.map(r => '<div class="sb-related-item" onclick="highlightFile(\'' + r.id + '\')">\uD83D\uDD17 ' + r.fullName + '</div>').join('');
    } else {
      relatedSection.style.display = 'none';
    }
  } else {
    relatedSection.style.display = 'none';
  }

  const driveSection = document.getElementById('sb-drive-section');
  const driveEl = document.getElementById('sb-drive');
  if (d.type === "file" && d.driveUrl) {
    driveSection.style.display = 'block';
    driveEl.href = d.driveUrl;
  } else {
    driveSection.style.display = 'none';
  }
  sb.classList.add('open');
}

function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }

function highlightTopic(slug) {
  filterCategory('all');
  const q = document.getElementById('search');
  const target = nodeMap[slug];
  q.value = target ? target.fullName : slug;
  filterGraph(q.value);
  closeSidebar();
}

function highlightFile(fid) {
  filterCategory('all');
  const f = nodeMap[fid];
  if (f) {
    const q = document.getElementById('search');
    q.value = f.fullName;
    filterGraph(f.fullName);
    openSidebar(f);
  }
}

function resetView() {
  document.getElementById('search').value = '';
  filterGraph('');
  filterCategory('all');
  document.querySelectorAll('.filters button')[0].classList.add('active');
  closeSidebar();
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
}

// Initial opacity
link.attr("opacity", l => l.type === "shared" ? 0.3 : 0.15);
</script>
</body>
</html>
